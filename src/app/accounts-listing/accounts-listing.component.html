<div class="accounts-card">
  <div class="table-header">
    <div class="header-left">
      <h3 class="section-title">Accounts</h3>
    </div>
    <div class="header-actions">
      <span class="p-input-icon-left search-input">
        <i class="pi pi-search"></i>
        <input
          pInputText
          [(ngModel)]="searchAccount"
          type="text"
          (input)="applyFilterGlobal($event, 'contains')"
          placeholder="Search accounts..."
        />
      </span>
      <p-button
        severity="success"
        (onClick)="addAccount(personID)"
        label="Create New Account"
      ></p-button>
    </div>
  </div>

  <div class="table-scroll">
    <p-table [value]="accounts">
      <ng-template pTemplate="header">
        <tr>
          <th></th>
          <th pSortableColumn="AccountNumber">
            <span>Account Number</span>
            <p-sortIcon field="AccountNumber"></p-sortIcon>
          </th>
          <th pSortableColumn="AccountType">
            <span>Account Type</span>
            <p-sortIcon field="AccountType"></p-sortIcon>
          </th>
          <th pSortableColumn="Balance">
            <span>Balance</span>
            <p-sortIcon field="Balance"></p-sortIcon>
          </th>
          <th pSortableColumn="IsClosed">
            <span>Is Closed</span>
            <p-sortIcon field="IsClosed"></p-sortIcon>
          </th>
          <th pSortableColumn="ActiveInd">
            <span>Active</span>
            <p-sortIcon field="ActiveInd"></p-sortIcon>
          </th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-account>
        <tr>
          <td>
            <p-button
              severity="info"
              label="Edit"
              (onClick)="openEdit(account.accountID)"
              title="Edit account details"
            ></p-button>
          </td>
          <td>{{ account.accountNumber }}</td>
          <td>{{ account.accountType }}</td>
          <td>{{ account.balance | currency:'ZAR':'symbol' }}</td>
          <td>
            <p-checkbox
              [disabled]="true"
              [binary]="true"
              [(ngModel)]="account.IsClosed"
            ></p-checkbox>
          </td>
          <td>
            <p-checkbox
              [disabled]="true"
              [binary]="true"
              [(ngModel)]="account.activeInd"
            ></p-checkbox>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
